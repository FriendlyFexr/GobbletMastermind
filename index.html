<html lang="en">

<style>
  :root {
    --bg: #f4f5f8; --panel: #ffffff; --text: #1d2330; --muted: #667085; --line: #d8dce5;
    --cell: #e9edf4; --cell-hover: #dfe5ef;
    --red: #e5484d; --red-d: #a52a30; --blue: #3e7bfa; --blue-d: #2250b4;

      --cell: #262d39; --cell-hover: #2d3544;
      --red: #f0636a; --red-d: #b8323a; --blue: #5b93ff; --blue-d: #2f60c8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 520px; margin: 0 auto; padding: 18px 14px 40px; }
  h1 { font-size: 1.35rem; margin: 0 0 2px; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .controls label { font-size: .85rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  select, button.btn {
    font: inherit; font-size: .9rem; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer;
  }
  button.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }

  #status {
    min-height: 2.6em; display: flex; align-items: center; justify-content: center; text-align: center;
    font-weight: 600; margin: 4px 0 10px;
  }
  #status.win { color: var(--target); }
  #status.lose { color: var(--red); }

  .tray { display: flex; align-items: center; gap: 12px; padding: 8px 10px; background: var(--panel);
          border: 1px solid var(--line); border-radius: 12px; }
  .tray .who { font-size: .8rem; font-weight: 700; width: 74px; flex: none; }
  .tray .pieces { display: flex; gap: 12px; align-items: center; flex: 1; justify-content: space-around; }
  .tray.active { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
  .slot { position: relative; width: 56px; height: 56px; display: grid; place-items: center;

  .slot.clickable { cursor: pointer; }
  .slot.clickable:hover { background: var(--cell-hover); }
  .slot.empty { opacity: .25; }
  .slot.sel { outline: 3px solid var(--accent); }
